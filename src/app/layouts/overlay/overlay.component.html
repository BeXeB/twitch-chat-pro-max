<main
  class="overlay-page"
  [class.overlay-black-preview]="blackPreview"
  aria-label="Twitch stream overlay"
>
  @if (activeAlert(); as alert) {
    <section class="overlay-alerts" aria-live="polite" aria-atomic="true">
      <article class="overlay-alert" [class]="'overlay-alert alert-' + alert.type">
        <img class="overlay-alert-image" [src]="alertPresets[alert.type].imageUrl" alt="" />
        <div class="overlay-alert-copy">
          <h2>{{ alertTitle(alert) }}</h2>
          <p>{{ describeAlert(alert) }}</p>
        </div>
      </article>
    </section>
  }

  <section class="overlay-chat" aria-label="Live chat">
    @for (message of messages(); track message.id) {
      <p class="overlay-message">
        <strong [style.color]="message.color ?? null">{{ message.displayName }}</strong>
        <span>: {{ message.message }}</span>
      </p>
    }
  </section>
</main>
