<main
  class="overlay-page"
  [class.overlay-black-preview]="blackPreview"
  aria-label="Twitch stream overlay"
>
  @if (alerts().length > 0) {
    <section class="overlay-alerts" aria-label="Recent stream alerts">
      @for (alert of alerts(); track alert.id) {
        <p class="overlay-alert" [class]="'overlay-alert alert-' + alert.type">
          @if (alert.type === 'automation' && alert.data.title) {
            <strong>{{ alert.data.title }}</strong>
          }
          {{ describeAlert(alert) }}
        </p>
      }
    </section>
  }

  <section class="overlay-chat" aria-label="Live chat">
    @for (message of messages(); track message.id) {
      <p class="overlay-message">
        <strong [style.color]="message.color ?? null">{{ message.displayName }}</strong>
        <span>{{ message.message }}</span>
      </p>
    }
  </section>
</main>
