<main
  class="overlay-page"
  [class.overlay-black-preview]="blackPreview"
  aria-label="Twitch stream overlay"
>
  <section class="overlay-chat" aria-label="Live chat">
    @for (message of messages(); track message.id) {
      <p
        class="overlay-message"
        [class.overlay-message--border-neon]="
          borderClassFor(message.userId) === 'overlay-message--border-neon'
        "
        [class.overlay-message--border-ornate]="
          borderClassFor(message.userId) === 'overlay-message--border-ornate'
        "
        [class.overlay-message--border-starlight]="
          borderClassFor(message.userId) === 'overlay-message--border-starlight'
        "
        [class.overlay-message--background-split-contrast-blue]="
          backgroundClassFor(message.userId) === 'overlay-message--background-split-contrast-blue'
        "
        [style.--message-background-color]="backgroundColorFor(message.userId)"
        [style.--message-border-color]="borderColorFor(message.userId)"
        [style.animation-name]="entryAnimationFor(message.id, message.userId)"
      >
        <strong
          [style.color]="cosmeticsFor(message.userId)['username-color'] ?? message.color ?? null"
        >
          {{ message.displayName }}
        </strong>
        <span
          [style.color]="cosmeticsFor(message.userId)['message-color'] ?? null"
          [style.font-family]="messageFontFamilyFor(message.userId)"
        >
          : {{ message.message }}
        </span>
      </p>
    }
  </section>
</main>
