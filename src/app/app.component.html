<h1>{{ title }}</h1>

@if (!accessToken) {
  <button (click)="connectToTwitch()">Connect to Twitch</button>
} @else {
  <p>Connected to Twitch!</p>

  <div class="chat">
    @for (message of messages$ | async; track message.id) {
      <div class="chat-message">
        <strong>
          {{ message.displayName }}
        </strong>

        <span>
          {{ message.message }}
        </span>
      </div>
    }
  </div>
}
